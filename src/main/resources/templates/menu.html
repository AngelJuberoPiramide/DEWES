<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurante - Menu</title>
</head>
<body>
    <h2>Platos guardados</h2>
    <div th:each="plato : ${platos}">
        <p th:text="${plato.nombre}"></p>
        <p th:text="${plato.precio}"></p>
        <p th:text="${plato.tipo}"></p>
    </div>
</body>
</html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
